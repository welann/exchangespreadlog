<!doctype html>
<!--
  THROWAWAY PROTOTYPE — Three spread-analysis workbench variants, switchable with ?variant=A|B|C.
  Question: which information hierarchy makes a cross-exchange opportunity easiest to understand?
  Mock data only. Delete losing variants after a direction is chosen.
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0f17'/%3E%3Cpath d='M7 21l5-7 4 4 8-9' fill='none' stroke='%2342c8f5' stroke-width='3'/%3E%3C/svg%3E"
    />
    <title>SpreadDesk · Lightweight Charts Prototype</title>
    <script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
      :root {
        --cockpit: #0a0f17;
        --steel: #101824;
        --raised: #162131;
        --line: #263448;
        --line-soft: #1b2838;
        --ink: #e5edf8;
        --muted: #7f8da1;
        --cyan: #42c8f5;
        --amber: #f2a93b;
        --mint: #44d7a8;
        --coral: #ff6b6b;
        --violet: #a58af4;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
        --data-font: ui-monospace, "SFMono-Regular", "Cascadia Code", Consolas, monospace;
        --body-font: "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        --display-font: "Arial Narrow", "Avenir Next Condensed", "DIN Condensed", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--cockpit);
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--cockpit);
        font-family: var(--body-font);
        font-size: 14px;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }

      .prototype-shell {
        min-height: 100vh;
        padding-bottom: 82px;
      }

      .global-bar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        min-height: 54px;
        border-bottom: 1px solid var(--line);
        padding: 0 18px;
        background: #080d14;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }

      .brand strong {
        font-family: var(--display-font);
        font-size: 16px;
        letter-spacing: 0.12em;
      }

      .brand span,
      .global-context,
      .mock-label {
        color: var(--muted);
        font-size: 12px;
      }

      .global-context {
        justify-self: center;
      }

      .connection {
        display: flex;
        align-items: center;
        justify-self: end;
        gap: 8px;
        font-family: var(--data-font);
        font-size: 11px;
      }

      .connection i {
        width: 7px;
        height: 7px;
        border: 1px solid var(--mint);
        border-radius: 50%;
        background: var(--mint);
      }

      .variant-page {
        min-height: calc(100vh - 54px);
      }

      .surface {
        border: 1px solid var(--line);
        background: var(--steel);
      }

      .section-label {
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .numeric {
        font-family: var(--data-font);
        font-variant-numeric: tabular-nums;
      }

      .positive {
        color: var(--mint) !important;
      }

      .negative {
        color: var(--coral) !important;
      }

      .pair-list {
        display: grid;
        gap: 2px;
      }

      .pair-button {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 5px 12px;
        width: 100%;
        min-height: 58px;
        border: 1px solid transparent;
        border-left: 2px solid transparent;
        padding: 9px 10px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .pair-button:hover,
      .pair-button.active {
        border-color: var(--line);
        border-left-color: var(--cyan);
        background: var(--raised);
      }

      .pair-button strong {
        font-size: 13px;
      }

      .pair-button span {
        color: var(--muted);
        font-size: 11px;
      }

      .pair-button output {
        grid-row: span 2;
        align-self: center;
        font-family: var(--data-font);
        font-size: 12px;
      }

      .pair-button small {
        color: var(--muted);
        font-size: 10px;
      }

      .route-ribbon {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        min-height: 52px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 8px 14px;
        background: #0d1520;
      }

      .route-ribbon .route-kicker {
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .route-ribbon strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 600;
      }

      .route-ribbon output {
        font-family: var(--data-font);
        font-size: 18px;
        font-weight: 750;
      }

      .route-arrow {
        color: var(--muted);
        padding: 0 6px;
      }

      .chart-frame {
        position: relative;
        min-height: 460px;
        overflow: hidden;
        background: #0b111a;
      }

      .chart-host {
        width: 100%;
        height: 100%;
        min-height: inherit;
      }

      .chart-legend {
        position: absolute;
        z-index: 4;
        top: 10px;
        left: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 7px 13px;
        pointer-events: none;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 10px;
      }

      .legend-item i {
        width: 13px;
        height: 2px;
        background: currentColor;
      }

      .legend-item.a {
        color: var(--cyan);
      }

      .legend-item.b {
        color: var(--amber);
      }

      .legend-item.best {
        color: var(--mint);
      }

      .chart-hint {
        position: absolute;
        z-index: 4;
        right: 12px;
        bottom: 8px;
        color: #657387;
        font-size: 10px;
        pointer-events: none;
      }

      .toolbar {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 6px;
      }

      .toolbar button,
      .plain-button {
        min-height: 31px;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0 10px;
        background: #0d141e;
        cursor: pointer;
      }

      .toolbar button:hover,
      .toolbar button.active,
      .plain-button:hover {
        border-color: #52677f;
        background: var(--raised);
      }

      .toolbar button.active {
        color: #07131b;
        border-color: var(--cyan);
        background: var(--cyan);
        font-weight: 700;
      }

      .interval-control {
        display: flex;
        min-height: 31px;
        align-items: center;
        gap: 6px;
        margin-left: 4px;
        border-left: 1px solid var(--line);
        padding-left: 10px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .interval-control input {
        width: 52px;
        height: 31px;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0 5px 0 8px;
        color: var(--ink);
        background: #0d141e;
        font-family: var(--data-font);
        font-size: 11px;
      }

      .interval-control input:focus {
        border-color: var(--cyan);
        outline: 1px solid var(--cyan);
        outline-offset: 1px;
      }

      .interval-control em {
        color: var(--ink);
        font-family: var(--data-font);
        font-style: normal;
        letter-spacing: 0;
        text-transform: none;
      }

      .threshold-control {
        display: grid;
        grid-template-columns: auto 90px auto;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 11px;
      }

      .threshold-control input {
        accent-color: var(--cyan);
      }

      .threshold-control output {
        min-width: 5ch;
        color: var(--ink);
        font-family: var(--data-font);
      }

      .metric-grid {
        display: grid;
      }

      .metric {
        display: grid;
        gap: 5px;
        border-bottom: 1px solid var(--line-soft);
        padding: 12px 0;
      }

      .metric span {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .metric strong {
        font-family: var(--data-font);
        font-size: 15px;
        font-weight: 600;
      }

      .book {
        display: grid;
        gap: 8px;
      }

      .book-row {
        display: grid;
        grid-template-columns: 44px 1fr 1fr;
        align-items: center;
        gap: 8px;
        font-family: var(--data-font);
        font-size: 11px;
      }

      .book-row span:first-child {
        color: var(--muted);
        font-family: var(--body-font);
      }

      .book-row strong,
      .book-row output {
        justify-self: end;
        font-weight: 500;
      }

      .decision-note {
        border-left: 2px solid var(--amber);
        padding: 9px 10px;
        color: #bac5d4;
        background: #101a27;
        font-size: 11px;
        line-height: 1.55;
      }

      /* Variant A — analytical cockpit: chart between selection and decision rails. */
      .variant-a {
        display: grid;
        grid-template-columns: 210px minmax(520px, 1fr) 236px;
      }

      .a-market-rail,
      .a-decision-rail {
        min-height: calc(100vh - 54px);
        background: #0c121b;
      }

      .a-market-rail {
        border-right: 1px solid var(--line);
      }

      .a-decision-rail {
        border-left: 1px solid var(--line);
      }

      .rail-head,
      .rail-block {
        border-bottom: 1px solid var(--line);
        padding: 13px;
      }

      .rail-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .rail-head strong {
        font-family: var(--data-font);
        font-size: 11px;
      }

      .a-main {
        min-width: 0;
      }

      .pair-command {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        min-height: 86px;
        padding: 14px 16px;
      }

      .pair-command h1 {
        margin: 0;
        font-family: var(--display-font);
        font-size: clamp(28px, 4vw, 48px);
        font-stretch: condensed;
        letter-spacing: -0.025em;
        line-height: 0.95;
      }

      .pair-command p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .a-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 9px 12px;
      }

      .a-chart {
        min-height: calc(100vh - 255px);
      }

      .sample-time {
        margin-top: 5px;
        color: var(--muted);
        font-family: var(--data-font);
        font-size: 11px;
      }

      /* Variant B — timeline first: full-width chart, analysis in a lower ledger. */
      .variant-b {
        display: grid;
        grid-template-rows: auto auto minmax(520px, calc(100vh - 270px)) auto;
      }

      .b-command {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        padding: 17px 20px 14px;
      }

      .b-title-line {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 12px;
      }

      .b-command h1 {
        margin: 0;
        font-family: var(--display-font);
        font-size: clamp(30px, 5vw, 58px);
        letter-spacing: -0.035em;
        line-height: 0.9;
      }

      .b-command .venue-pair {
        color: var(--muted);
        font-size: 12px;
      }

      .pair-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 15px;
      }

      .pair-tabs button {
        min-height: 30px;
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 0 8px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
      }

      .pair-tabs button.active {
        color: var(--ink);
        border-bottom-color: var(--cyan);
      }

      .b-verdict {
        align-self: start;
        min-width: 230px;
        border-left: 1px solid var(--line);
        padding-left: 18px;
      }

      .b-verdict output {
        display: block;
        margin-top: 4px;
        font-family: var(--data-font);
        font-size: 30px;
        font-weight: 700;
      }

      .b-chart-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 8px 20px;
        background: #0d131d;
      }

      .b-chart {
        min-height: 520px;
      }

      .b-ledger {
        display: grid;
        grid-template-columns: 1.25fr 1fr 1fr;
        border-top: 1px solid var(--line);
      }

      .ledger-section {
        min-width: 0;
        border-right: 1px solid var(--line);
        padding: 14px 18px;
      }

      .ledger-section:last-child {
        border-right: 0;
      }

      .tape {
        display: grid;
        grid-template-columns: repeat(5, minmax(72px, 1fr));
        gap: 1px;
        margin-top: 11px;
        background: var(--line);
      }

      .tape-cell {
        display: grid;
        gap: 5px;
        min-width: 0;
        padding: 9px;
        background: var(--steel);
      }

      .tape-cell span {
        color: var(--muted);
        font-family: var(--data-font);
        font-size: 10px;
      }

      .tape-cell strong {
        font-family: var(--data-font);
        font-size: 12px;
      }

      /* Variant C — scanner: relative ranking is primary, chart is the drill-down. */
      .variant-c {
        display: grid;
        grid-template-columns: minmax(310px, 34vw) minmax(0, 1fr);
        min-height: calc(100vh - 54px);
      }

      .scanner {
        border-right: 1px solid var(--line);
        background: #0b121b;
      }

      .scanner-head {
        padding: 16px;
      }

      .scanner-head h1 {
        margin: 5px 0 0;
        font-family: var(--display-font);
        font-size: 34px;
        letter-spacing: -0.02em;
      }

      .scanner-table {
        width: 100%;
        border-collapse: collapse;
      }

      .scanner-table th,
      .scanner-table td {
        height: 45px;
        border-top: 1px solid var(--line-soft);
        padding: 7px 10px;
        text-align: right;
      }

      .scanner-table th {
        color: var(--muted);
        font-size: 9px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .scanner-table th:first-child,
      .scanner-table td:first-child {
        text-align: left;
      }

      .scanner-table tbody tr {
        cursor: pointer;
      }

      .scanner-table tbody tr:hover,
      .scanner-table tbody tr.active {
        background: var(--raised);
      }

      .scanner-table tbody tr.active td:first-child {
        box-shadow: inset 2px 0 0 var(--cyan);
      }

      .scanner-table td {
        font-family: var(--data-font);
        font-size: 11px;
      }

      .scanner-table .heat {
        position: relative;
      }

      .scanner-table .heat::before {
        position: absolute;
        z-index: 0;
        inset: 6px 4px;
        width: var(--heat-width);
        max-width: calc(100% - 8px);
        background: var(--heat-color);
        content: "";
        opacity: 0.16;
      }

      .scanner-table .heat span {
        position: relative;
        z-index: 1;
      }

      .c-focus {
        display: grid;
        grid-template-rows: auto auto minmax(470px, 1fr) auto;
        min-width: 0;
      }

      .c-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 18px;
      }

      .c-header h2 {
        margin: 2px 0 5px;
        font-family: var(--display-font);
        font-size: clamp(30px, 5vw, 54px);
        letter-spacing: -0.03em;
        line-height: 0.95;
      }

      .c-header p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .c-score {
        min-width: 160px;
        text-align: right;
      }

      .c-score output {
        display: block;
        margin-top: 4px;
        font-family: var(--data-font);
        font-size: 28px;
        font-weight: 700;
      }

      .c-chart {
        min-height: 470px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .c-bottom {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
      }

      .execution-ticket,
      .c-stats {
        padding: 14px 18px;
      }

      .execution-ticket {
        border-right: 1px solid var(--line);
      }

      .ticket-route {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 10px;
        margin-top: 11px;
      }

      .ticket-leg {
        display: grid;
        gap: 4px;
        border: 1px solid var(--line);
        padding: 10px;
      }

      .ticket-leg span {
        color: var(--muted);
        font-size: 10px;
      }

      .ticket-leg strong {
        font-size: 12px;
      }

      .ticket-leg output {
        font-family: var(--data-font);
      }

      .ticket-arrow {
        color: var(--cyan);
        font-size: 18px;
      }

      .c-stats .metric-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      /* Prototype-only switcher. */
      .prototype-switcher {
        position: fixed;
        z-index: 100;
        bottom: 18px;
        left: 50%;
        display: grid;
        grid-template-columns: 36px minmax(190px, auto) 36px;
        overflow: hidden;
        border: 1px solid #58708b;
        border-radius: 7px;
        background: #e8eef7;
        box-shadow: var(--shadow);
        transform: translateX(-50%);
      }

      .prototype-switcher button {
        min-height: 38px;
        border: 0;
        color: #111a25;
        background: transparent;
        cursor: pointer;
      }

      .prototype-switcher button:hover {
        background: #d4deeb;
      }

      .prototype-switcher output {
        display: grid;
        min-height: 38px;
        place-items: center;
        border-right: 1px solid #bdc9d8;
        border-left: 1px solid #bdc9d8;
        padding: 0 13px;
        color: #111a25;
        font-size: 12px;
        font-weight: 700;
      }

      .prototype-note {
        position: fixed;
        z-index: 99;
        right: 12px;
        bottom: 12px;
        color: #617086;
        font-size: 9px;
      }

      .prototype-note a {
        color: #8394aa;
      }

      @media (max-width: 1050px) {
        .variant-a {
          grid-template-columns: 190px minmax(0, 1fr);
        }

        .a-decision-rail {
          grid-column: 1 / -1;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          min-height: auto;
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        .a-decision-rail .rail-head {
          display: none;
        }

        .a-decision-rail .rail-block {
          border-right: 1px solid var(--line);
        }

        .b-ledger {
          grid-template-columns: 1fr 1fr;
        }

        .b-ledger .ledger-section:first-child {
          grid-column: 1 / -1;
          border-bottom: 1px solid var(--line);
        }

        .variant-c {
          grid-template-columns: 290px minmax(0, 1fr);
        }
      }

      @media (max-width: 760px) {
        .global-bar {
          grid-template-columns: 1fr auto;
          gap: 10px;
        }

        .global-context {
          display: none;
        }

        .brand span {
          display: none;
        }

        .variant-a,
        .variant-c {
          display: block;
        }

        .a-market-rail,
        .scanner {
          min-height: 0;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .pair-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          max-height: 190px;
          overflow-y: auto;
        }

        .pair-button {
          min-height: 54px;
        }

        .a-chart,
        .b-chart,
        .c-chart {
          min-height: 430px;
        }

        .a-decision-rail {
          display: block;
        }

        .pair-command,
        .b-command,
        .c-header {
          display: grid;
        }

        .b-verdict {
          min-width: 0;
          border-top: 1px solid var(--line);
          border-left: 0;
          padding-top: 10px;
          padding-left: 0;
        }

        .b-ledger,
        .c-bottom {
          display: block;
        }

        .ledger-section,
        .execution-ticket {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .tape {
          grid-template-columns: repeat(2, 1fr);
        }

        .scanner {
          max-height: 280px;
          overflow-y: auto;
        }

        .route-ribbon {
          grid-template-columns: 1fr auto;
        }

        .route-ribbon .route-kicker {
          display: none;
        }

        .route-ribbon strong {
          white-space: normal;
        }

        .interval-control {
          width: 100%;
          margin-left: 0;
          border-left: 0;
          padding-top: 3px;
          padding-left: 0;
        }

        .prototype-note {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="prototype-shell">
      <header class="global-bar">
        <div class="brand">
          <strong>SPREADDESK</strong>
          <span>Cross-venue execution monitor</span>
        </div>
        <div class="global-context">PROTOTYPE · MOCK DATA</div>
        <div class="connection"><i aria-hidden="true"></i> SIMULATED FEED</div>
      </header>
      <main id="app"></main>
    </div>

    <nav class="prototype-switcher" aria-label="原型视图切换">
      <button id="previous-variant" type="button" aria-label="上一版">←</button>
      <output id="variant-label">A — Decision cockpit</output>
      <button id="next-variant" type="button" aria-label="下一版">→</button>
    </nav>
    <div class="prototype-note">
      Mock data · <a href="https://www.tradingview.com/" target="_blank" rel="noreferrer">Charts by TradingView</a>
    </div>

    <script>
      (() => {
        const TV = window.LightweightCharts;
        const variants = [
          { key: "A", name: "Decision cockpit" },
          { key: "B", name: "Timeline first" },
          { key: "C", name: "Opportunity scanner" }
        ];
        const pairs = [
          { symbol: "INTC/USD", a: "lighter", b: "ondo", basePrice: 103.1, seed: 11 },
          { symbol: "BNB/USDC", a: "hyperliquid", b: "lighter", basePrice: 560.2, seed: 22 },
          { symbol: "BTC/USD", a: "perpl", b: "01", basePrice: 117340, seed: 33 },
          { symbol: "HYPE/USDC", a: "hyperliquid", b: "risex", basePrice: 43.7, seed: 44 },
          { symbol: "XAU/USD", a: "ondo", b: "lighter", basePrice: 3362, seed: 55 },
          { symbol: "SOL/USD", a: "01", b: "perpl", basePrice: 186.4, seed: 66 }
        ];

        const state = {
          pairIndex: 0,
          range: "24H",
          intervalMinutes: normalizeInterval(new URLSearchParams(location.search).get("interval") ?? 3),
          threshold: 1.5,
          variant: normalizedVariant(new URLSearchParams(location.search).get("variant")),
          chart: null,
          chartSeries: [],
          data: []
        };

        function normalizedVariant(value) {
          return variants.some((variant) => variant.key === value) ? value : "A";
        }

        function normalizeInterval(value) {
          const interval = Math.round(Number(value));
          return Number.isFinite(interval) ? Math.min(240, Math.max(1, interval)) : 3;
        }

        function seededRandom(seed) {
          let value = seed % 2147483647;
          return () => {
            value = (value * 16807) % 2147483647;
            return (value - 1) / 2147483646;
          };
        }

        function generateData(pair) {
          const random = seededRandom(pair.seed);
          const points = [];
          const total = 24 * 60 + 1;
          const end = Math.floor(Date.now() / 60000) * 60;
          let common = 0;

          for (let index = 0; index < total; index += 1) {
            common += (random() - 0.5) * pair.basePrice * 0.00009;
            const wave = Math.sin(index / 39) * 2.25 + Math.sin(index / 111) * 1.45;
            const shock = index % 291 === 0 ? (random() - 0.35) * 7 : 0;
            const divergenceBp = wave + shock + (random() - 0.5) * 2.5;
            const crossingCostBp = 1.15 + random() * 0.85;
            const fair = pair.basePrice + common;
            const aMid = fair * (1 + divergenceBp / 20000);
            const bMid = fair * (1 - divergenceBp / 20000);
            const aToB = divergenceBp - crossingCostBp;
            const bToA = -divergenceBp - crossingCostBp;
            const best = Math.max(aToB, bToA);
            const sellA = aToB >= bToA;
            const time = end - (total - 1 - index) * 60;

            points.push({
              time,
              aMid,
              bMid,
              aToB,
              bToA,
              best,
              sellVenue: sellA ? pair.a : pair.b,
              buyVenue: sellA ? pair.b : pair.a,
              sellPrice: sellA ? aMid * 1.000055 : bMid * 1.000055,
              buyPrice: sellA ? bMid * 1.000055 : aMid * 1.000055,
              aBid: aMid * 0.99995,
              aAsk: aMid * 1.00005,
              bBid: bMid * 0.99995,
              bAsk: bMid * 1.00005
            });
          }

          return points.filter(
            (_point, index) =>
              (total - 1 - index) % state.intervalMinutes === 0 || index === total - 1
          );
        }

        function formatBp(value) {
          if (!Number.isFinite(value)) return "—";
          return `${value > 0 ? "+" : ""}${value.toFixed(2)} bp`;
        }

        function formatPrice(value, basePrice = 100) {
          if (!Number.isFinite(value)) return "—";
          const digits = basePrice >= 10000 ? 1 : basePrice >= 100 ? 2 : 3;
          return value.toLocaleString("en-US", {
            minimumFractionDigits: digits,
            maximumFractionDigits: digits
          });
        }

        function formatTime(seconds) {
          return new Intl.DateTimeFormat("zh-CN", {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
          }).format(new Date(seconds * 1000));
        }

        function latestForPair(index) {
          const data = generateData(pairs[index]);
          return data[data.length - 1];
        }

        function pairButtons(className = "pair-list") {
          return `
            <div class="${className}">
              ${pairs
                .map((pair, index) => {
                  const latest = latestForPair(index);
                  return `
                    <button class="pair-button ${index === state.pairIndex ? "active" : ""}" type="button" data-pair="${index}">
                      <strong>${pair.symbol}</strong>
                      <output class="${latest.best >= state.threshold ? "positive" : ""}">${formatBp(latest.best)}</output>
                      <span>${pair.a} · ${pair.b}</span>
                      <small>${latest.best >= state.threshold ? "above threshold" : "watching"}</small>
                    </button>`;
                })
                .join("")}
            </div>`;
        }

        function rangeToolbar() {
          return `
            <div class="toolbar" aria-label="图表时间设置">
              ${["1H", "6H", "24H"]
                .map(
                  (range) =>
                    `<button type="button" class="${state.range === range ? "active" : ""}" data-range="${range}">${range}</button>`
                )
                .join("")}
              <button type="button" data-fit>Fit</button>
              <label class="interval-control">
                <span>Interval</span>
                <input
                  type="number"
                  min="1"
                  max="240"
                  step="1"
                  value="${state.intervalMinutes}"
                  inputmode="numeric"
                  aria-label="图表周期（分钟）"
                  data-interval
                />
                <em>m</em>
              </label>
            </div>`;
        }

        function thresholdControl() {
          return `
            <label class="threshold-control">
              <span>机会阈值</span>
              <input type="range" min="0" max="5" step="0.25" value="${state.threshold}" data-threshold />
              <output>${state.threshold.toFixed(2)} bp</output>
            </label>`;
        }

        function routeRibbon(point) {
          return `
            <div class="route-ribbon" aria-live="polite">
              <span class="route-kicker">Route at crosshair</span>
              <strong>
                SELL ${point.sellVenue.toUpperCase()}
                <span class="route-arrow">→</span>
                BUY ${point.buyVenue.toUpperCase()}
              </strong>
              <output class="${point.best >= state.threshold ? "positive" : point.best < 0 ? "negative" : ""}" data-live="best">
                ${formatBp(point.best)}
              </output>
            </div>`;
        }

        function metricMarkup(point) {
          const opportunityCount = state.data.filter((item) => item.best >= state.threshold).length;
          const positiveShare = (opportunityCount / state.data.length) * 100;
          const average = state.data.reduce((sum, item) => sum + item.best, 0) / state.data.length;
          const maximum = Math.max(...state.data.map((item) => item.best));
          return `
            <div class="metric"><span>区间最大</span><strong class="positive">${formatBp(maximum)}</strong></div>
            <div class="metric"><span>平均 best</span><strong>${formatBp(average)}</strong></div>
            <div class="metric"><span>越线样本</span><strong>${opportunityCount} / ${state.data.length}</strong></div>
            <div class="metric"><span>机会占比</span><strong>${positiveShare.toFixed(1)}%</strong></div>
            <div class="metric"><span>当前时间</span><strong data-live="time">${formatTime(point.time)}</strong></div>`;
        }

        function bookMarkup(point, pair) {
          return `
            <div class="book">
              <div class="book-row"><span>Venue</span><strong>${pair.a}</strong><strong>${pair.b}</strong></div>
              <div class="book-row"><span>Bid</span><output data-live="a-bid">${formatPrice(point.aBid, pair.basePrice)}</output><output data-live="b-bid">${formatPrice(point.bBid, pair.basePrice)}</output></div>
              <div class="book-row"><span>Ask</span><output data-live="a-ask">${formatPrice(point.aAsk, pair.basePrice)}</output><output data-live="b-ask">${formatPrice(point.bAsk, pair.basePrice)}</output></div>
              <div class="book-row"><span>Mid</span><output data-live="a-mid">${formatPrice(point.aMid, pair.basePrice)}</output><output data-live="b-mid">${formatPrice(point.bMid, pair.basePrice)}</output></div>
            </div>`;
        }

        function renderVariantA(pair, point) {
          return `
            <section class="variant-page variant-a">
              <aside class="a-market-rail">
                <div class="rail-head"><span class="section-label">Markets</span><strong>${pairs.length}</strong></div>
                ${pairButtons()}
                <div class="rail-block">
                  <div class="section-label">Interpretation</div>
                  <p class="decision-note">绿线越过阈值才进入机会状态；下方价格 pane 用来判断价差来自哪一条腿。</p>
                </div>
              </aside>

              <section class="a-main">
                <header class="pair-command">
                  <div>
                    <h1>${pair.symbol}</h1>
                    <p>${pair.a} vs ${pair.b} · ${state.intervalMinutes}m gross top-of-book spread</p>
                  </div>
                  ${rangeToolbar()}
                </header>
                ${routeRibbon(point)}
                <div class="a-controls">
                  ${thresholdControl()}
                  <div class="mock-label">Drag to pan · wheel to zoom · hover to inspect</div>
                </div>
                <div class="chart-frame a-chart">
                  <div class="chart-legend">
                    <span class="legend-item a"><i></i>A bid − B ask</span>
                    <span class="legend-item b"><i></i>B bid − A ask</span>
                    <span class="legend-item best"><i></i>threshold ${state.threshold.toFixed(2)} bp</span>
                  </div>
                  <div class="chart-host" data-chart="spread-price"></div>
                  <div class="chart-hint">Upper: executable spread · Lower: venue mid prices</div>
                </div>
              </section>

              <aside class="a-decision-rail">
                <div class="rail-head"><span class="section-label">Decision rail</span><strong>MOCK</strong></div>
                <div class="rail-block">
                  <div class="section-label">Window diagnostics</div>
                  <div class="metric-grid">${metricMarkup(point)}</div>
                </div>
                <div class="rail-block">
                  <div class="section-label">Book at crosshair</div>
                  <div style="height: 11px"></div>
                  ${bookMarkup(point, pair)}
                </div>
                <div class="rail-block">
                  <div class="section-label">Selected route</div>
                  <p class="sample-time" data-live="route">${point.sellVenue} → ${point.buyVenue}</p>
                  <p class="decision-note">这里只展示毛价差。真实决策仍需扣除手续费、滑点和延迟。</p>
                </div>
              </aside>
            </section>`;
        }

        function tapeMarkup() {
          return state.data
            .slice(-5)
            .map(
              (point) => `
                <div class="tape-cell">
                  <span>${formatTime(point.time).slice(-5)}</span>
                  <strong class="${point.best >= state.threshold ? "positive" : point.best < 0 ? "negative" : ""}">${formatBp(point.best)}</strong>
                </div>`
            )
            .join("");
        }

        function renderVariantB(pair, point) {
          return `
            <section class="variant-page variant-b">
              <header class="b-command">
                <div>
                  <div class="b-title-line">
                    <h1>${pair.symbol}</h1>
                    <span class="venue-pair">${pair.a} / ${pair.b}</span>
                  </div>
                  <div class="pair-tabs">
                    ${pairs
                      .slice(0, 5)
                      .map(
                        (item, index) =>
                          `<button type="button" class="${index === state.pairIndex ? "active" : ""}" data-pair="${index}">${item.symbol}</button>`
                      )
                      .join("")}
                  </div>
                </div>
                <div class="b-verdict">
                  <span class="section-label">Best executable now</span>
                  <output class="${point.best >= state.threshold ? "positive" : "negative"}" data-live="best">${formatBp(point.best)}</output>
                  <div class="sample-time" data-live="route">${point.sellVenue} → ${point.buyVenue}</div>
                </div>
              </header>

              ${routeRibbon(point)}

              <div class="chart-frame b-chart">
                <div class="b-chart-toolbar">
                  ${rangeToolbar()}
                  ${thresholdControl()}
                </div>
                <div class="chart-legend" style="top: 54px">
                  <span class="legend-item a"><i></i>${pair.a} mid</span>
                  <span class="legend-item b"><i></i>${pair.b} mid</span>
                  <span class="legend-item best"><i></i>best spread histogram</span>
                </div>
                <div class="chart-host" data-chart="price-opportunity"></div>
                <div class="chart-hint">Price first · opportunity histogram below</div>
              </div>

              <section class="b-ledger">
                <div class="ledger-section">
                  <span class="section-label">Recent opportunity tape</span>
                  <div class="tape">${tapeMarkup()}</div>
                </div>
                <div class="ledger-section">
                  <span class="section-label">Book at crosshair</span>
                  <div style="height: 11px"></div>
                  ${bookMarkup(point, pair)}
                </div>
                <div class="ledger-section">
                  <span class="section-label">Why this layout</span>
                  <p class="decision-note">先看两所价格何时分离，再看下方柱状图是否跨过可执行阈值，适合复盘行情来源。</p>
                </div>
              </section>
            </section>`;
        }

        function scannerRows() {
          return pairs
            .map((pair, index) => {
              const point = latestForPair(index);
              const intensity = Math.min(100, Math.max(8, Math.abs(point.best) * 17));
              const color = point.best >= state.threshold ? "var(--mint)" : point.best < 0 ? "var(--coral)" : "var(--amber)";
              return `
                <tr class="${index === state.pairIndex ? "active" : ""}" data-pair="${index}">
                  <td><strong>${pair.symbol}</strong><br /><span class="mock-label">${pair.a} · ${pair.b}</span></td>
                  <td class="heat" style="--heat-width:${intensity}%;--heat-color:${color}"><span class="${point.best >= state.threshold ? "positive" : point.best < 0 ? "negative" : ""}">${formatBp(point.best)}</span></td>
                  <td>${Math.max(3, Math.round(19 - Math.abs(point.best) * 1.8))}ms</td>
                  <td>${point.best >= state.threshold ? "OPEN" : "WATCH"}</td>
                </tr>`;
            })
            .join("");
        }

        function renderVariantC(pair, point) {
          const max = Math.max(...state.data.map((item) => item.best));
          const opportunities = state.data.filter((item) => item.best >= state.threshold).length;
          return `
            <section class="variant-page variant-c">
              <aside class="scanner">
                <header class="scanner-head">
                  <span class="section-label">Opportunity scanner</span>
                  <h1>Cross-venue board</h1>
                </header>
                <table class="scanner-table">
                  <thead><tr><th>Market</th><th>Best</th><th>Age</th><th>State</th></tr></thead>
                  <tbody>${scannerRows()}</tbody>
                </table>
              </aside>

              <section class="c-focus">
                <header class="c-header">
                  <div>
                    <span class="section-label">Focused route</span>
                    <h2>${pair.symbol}</h2>
                    <p>${pair.a} vs ${pair.b} · ${state.range} / ${state.intervalMinutes}m synthetic window</p>
                  </div>
                  <div class="c-score">
                    <span class="section-label">Current best</span>
                    <output class="${point.best >= state.threshold ? "positive" : "negative"}" data-live="best">${formatBp(point.best)}</output>
                  </div>
                </header>

                <div class="a-controls">
                  ${rangeToolbar()}
                  ${thresholdControl()}
                </div>

                <div class="chart-frame c-chart">
                  <div class="chart-legend">
                    <span class="legend-item best"><i></i>best executable route</span>
                    <span class="legend-item a"><i></i>positive = above threshold</span>
                  </div>
                  <div class="chart-host" data-chart="baseline"></div>
                  <div class="chart-hint">Single decision series · zero-centered</div>
                </div>

                <div class="c-bottom">
                  <section class="execution-ticket">
                    <span class="section-label">Execution ticket at crosshair</span>
                    <div class="ticket-route">
                      <div class="ticket-leg">
                        <span>SELL</span>
                        <strong data-live="sell-venue">${point.sellVenue}</strong>
                        <output data-live="sell-price">${formatPrice(point.sellPrice, pair.basePrice)}</output>
                      </div>
                      <div class="ticket-arrow">→</div>
                      <div class="ticket-leg">
                        <span>BUY</span>
                        <strong data-live="buy-venue">${point.buyVenue}</strong>
                        <output data-live="buy-price">${formatPrice(point.buyPrice, pair.basePrice)}</output>
                      </div>
                    </div>
                  </section>
                  <section class="c-stats">
                    <span class="section-label">Window facts</span>
                    <div class="metric-grid">
                      <div class="metric"><span>Max</span><strong class="positive">${formatBp(max)}</strong></div>
                      <div class="metric"><span>Signals</span><strong>${opportunities}</strong></div>
                      <div class="metric"><span>Sample</span><strong data-live="time">${formatTime(point.time)}</strong></div>
                    </div>
                  </section>
                </div>
              </section>
            </section>`;
        }

        function chartOptions() {
          return {
            autoSize: true,
            layout: {
              background: { type: "solid", color: "#0b111a" },
              textColor: "#8290a3",
              fontFamily: 'ui-monospace, "SFMono-Regular", Consolas, monospace',
              fontSize: 11,
              attributionLogo: true,
              panes: {
                separatorColor: "#263448",
                separatorHoverColor: "#52677f",
                enableResize: true
              }
            },
            grid: {
              vertLines: { color: "#162232", style: 1 },
              horzLines: { color: "#1b2838", style: 1 }
            },
            crosshair: {
              mode: TV.CrosshairMode.Normal,
              vertLine: { color: "#6b7e94", width: 1, style: 3, labelBackgroundColor: "#314158" },
              horzLine: { color: "#6b7e94", width: 1, style: 3, labelBackgroundColor: "#314158" }
            },
            rightPriceScale: {
              borderColor: "#263448",
              minimumWidth: 70,
              scaleMargins: { top: 0.14, bottom: 0.12 }
            },
            timeScale: {
              borderColor: "#263448",
              timeVisible: true,
              secondsVisible: false,
              rightOffset: 4,
              barSpacing: 5,
              minBarSpacing: 1
            },
            handleScroll: {
              mouseWheel: true,
              pressedMouseMove: true,
              horzTouchDrag: true,
              vertTouchDrag: false
            },
            handleScale: {
              axisPressedMouseMove: true,
              mouseWheel: true,
              pinch: true
            },
            kineticScroll: { mouse: true, touch: true },
            localization: {
              locale: "zh-CN",
              timeFormatter: (time) => formatTime(Number(time))
            }
          };
        }

        function lineData(key) {
          return state.data.map((point) => ({ time: point.time, value: point[key] }));
        }

        function addThresholdLine(series) {
          return series.createPriceLine({
            price: state.threshold,
            color: "#44d7a8",
            lineWidth: 1,
            lineStyle: 2,
            axisLabelVisible: true,
            title: "signal"
          });
        }

        function addZeroLine(series) {
          return series.createPriceLine({
            price: 0,
            color: "#637287",
            lineWidth: 1,
            lineStyle: 3,
            axisLabelVisible: true,
            title: "0"
          });
        }

        function createSpreadPriceChart(container) {
          const chart = TV.createChart(container, chartOptions());
          const seriesA = chart.addSeries(
            TV.LineSeries,
            {
              color: "#42c8f5",
              lineWidth: 2,
              priceFormat: { type: "custom", formatter: formatBp },
              title: "A→B",
              crosshairMarkerRadius: 4
            },
            0
          );
          const seriesB = chart.addSeries(
            TV.LineSeries,
            {
              color: "#f2a93b",
              lineWidth: 2,
              priceFormat: { type: "custom", formatter: formatBp },
              title: "B→A",
              crosshairMarkerRadius: 4
            },
            0
          );
          const priceA = chart.addSeries(
            TV.LineSeries,
            {
              color: "#42c8f5",
              lineWidth: 1,
              priceFormat: { type: "price", precision: 4, minMove: 0.0001 },
              title: pairs[state.pairIndex].a
            },
            1
          );
          const priceB = chart.addSeries(
            TV.LineSeries,
            {
              color: "#f2a93b",
              lineWidth: 1,
              priceFormat: { type: "price", precision: 4, minMove: 0.0001 },
              title: pairs[state.pairIndex].b
            },
            1
          );

          seriesA.setData(lineData("aToB"));
          seriesB.setData(lineData("bToA"));
          priceA.setData(lineData("aMid"));
          priceB.setData(lineData("bMid"));
          addZeroLine(seriesA);
          addThresholdLine(seriesA);
          chart.panes()[0]?.setHeight(Math.max(290, Math.round(container.clientHeight * 0.64)));
          chart.panes()[1]?.setHeight(Math.max(140, Math.round(container.clientHeight * 0.29)));
          return { chart, primarySeries: seriesA };
        }

        function createPriceOpportunityChart(container) {
          const chart = TV.createChart(container, chartOptions());
          const priceA = chart.addSeries(
            TV.LineSeries,
            { color: "#42c8f5", lineWidth: 2, title: pairs[state.pairIndex].a },
            0
          );
          const priceB = chart.addSeries(
            TV.LineSeries,
            { color: "#f2a93b", lineWidth: 2, title: pairs[state.pairIndex].b },
            0
          );
          const histogram = chart.addSeries(
            TV.HistogramSeries,
            {
              priceFormat: { type: "custom", formatter: formatBp },
              priceLineVisible: false,
              lastValueVisible: true,
              base: 0
            },
            1
          );

          priceA.setData(lineData("aMid"));
          priceB.setData(lineData("bMid"));
          histogram.setData(
            state.data.map((point) => ({
              time: point.time,
              value: point.best,
              color:
                point.best >= state.threshold
                  ? "rgba(68, 215, 168, 0.84)"
                  : point.best >= 0
                    ? "rgba(242, 169, 59, 0.68)"
                    : "rgba(255, 107, 107, 0.6)"
            }))
          );
          addZeroLine(histogram);
          addThresholdLine(histogram);
          chart.panes()[0]?.setHeight(Math.max(310, Math.round(container.clientHeight * 0.66)));
          chart.panes()[1]?.setHeight(Math.max(150, Math.round(container.clientHeight * 0.27)));
          return { chart, primarySeries: histogram };
        }

        function createBaselineChart(container) {
          const chart = TV.createChart(container, chartOptions());
          const series = chart.addSeries(TV.BaselineSeries, {
            baseValue: { type: "price", price: state.threshold },
            topLineColor: "#44d7a8",
            topFillColor1: "rgba(68, 215, 168, 0.28)",
            topFillColor2: "rgba(68, 215, 168, 0.04)",
            bottomLineColor: "#ff6b6b",
            bottomFillColor1: "rgba(255, 107, 107, 0.03)",
            bottomFillColor2: "rgba(255, 107, 107, 0.2)",
            lineWidth: 2,
            priceFormat: { type: "custom", formatter: formatBp },
            title: "best"
          });
          series.setData(lineData("best"));
          addZeroLine(series);
          addThresholdLine(series);
          return { chart, primarySeries: series };
        }

        function applyVisibleRange(chart) {
          const rangeSeconds = state.range === "1H" ? 3600 : state.range === "6H" ? 21600 : 86400;
          const visiblePoints = Math.min(
            state.data.length,
            Math.max(2, Math.ceil(rangeSeconds / (state.intervalMinutes * 60)) + 1)
          );
          chart.timeScale().setVisibleLogicalRange({
            from: Math.max(0, state.data.length - visiblePoints - 1),
            to: state.data.length + 3
          });
        }

        function updateReadout(point) {
          const pair = pairs[state.pairIndex];
          const values = {
            best: formatBp(point.best),
            time: formatTime(point.time),
            route: `${point.sellVenue} → ${point.buyVenue}`,
            "a-bid": formatPrice(point.aBid, pair.basePrice),
            "a-ask": formatPrice(point.aAsk, pair.basePrice),
            "a-mid": formatPrice(point.aMid, pair.basePrice),
            "b-bid": formatPrice(point.bBid, pair.basePrice),
            "b-ask": formatPrice(point.bAsk, pair.basePrice),
            "b-mid": formatPrice(point.bMid, pair.basePrice),
            "sell-venue": point.sellVenue,
            "buy-venue": point.buyVenue,
            "sell-price": formatPrice(point.sellPrice, pair.basePrice),
            "buy-price": formatPrice(point.buyPrice, pair.basePrice)
          };

          document.querySelectorAll("[data-live]").forEach((element) => {
            const key = element.getAttribute("data-live");
            if (values[key] !== undefined) element.textContent = values[key];
            if (key === "best") {
              element.classList.toggle("positive", point.best >= state.threshold);
              element.classList.toggle("negative", point.best < 0);
            }
          });
        }

        function attachChart() {
          const container = document.querySelector("[data-chart]");
          if (!container || !TV) return;

          const chartType = container.getAttribute("data-chart");
          const result =
            chartType === "spread-price"
              ? createSpreadPriceChart(container)
              : chartType === "price-opportunity"
                ? createPriceOpportunityChart(container)
                : createBaselineChart(container);

          state.chart = result.chart;
          applyVisibleRange(result.chart);
          const byTime = new Map(state.data.map((point) => [point.time, point]));
          result.chart.subscribeCrosshairMove((param) => {
            if (!param.time) return;
            const point = byTime.get(Number(param.time));
            if (point) updateReadout(point);
          });
          result.chart.subscribeClick((param) => {
            if (!param.time) return;
            const point = byTime.get(Number(param.time));
            if (point) updateReadout(point);
          });
        }

        function destroyChart() {
          if (state.chart) {
            state.chart.remove();
            state.chart = null;
          }
        }

        function render() {
          destroyChart();
          const pair = pairs[state.pairIndex];
          state.data = generateData(pair);
          const point = state.data[state.data.length - 1];
          const app = document.getElementById("app");
          app.innerHTML =
            state.variant === "A"
              ? renderVariantA(pair, point)
              : state.variant === "B"
                ? renderVariantB(pair, point)
                : renderVariantC(pair, point);

          document.getElementById("variant-label").textContent =
            `${state.variant} — ${variants.find((variant) => variant.key === state.variant).name}`;
          bindInteractions();
          requestAnimationFrame(attachChart);
        }

        function bindInteractions() {
          document.querySelectorAll("[data-pair]").forEach((element) => {
            element.addEventListener("click", () => {
              state.pairIndex = Number(element.getAttribute("data-pair"));
              render();
            });
          });

          document.querySelectorAll("[data-range]").forEach((element) => {
            element.addEventListener("click", () => {
              state.range = element.getAttribute("data-range");
              if (state.chart) applyVisibleRange(state.chart);
              document.querySelectorAll("[data-range]").forEach((button) => {
                button.classList.toggle("active", button.getAttribute("data-range") === state.range);
              });
            });
          });

          document.querySelectorAll("[data-fit]").forEach((element) => {
            element.addEventListener("click", () => state.chart?.timeScale().fitContent());
          });

          document.querySelectorAll("[data-interval]").forEach((element) => {
            element.addEventListener("change", () => {
              state.intervalMinutes = normalizeInterval(element.value);
              const url = new URL(location.href);
              url.searchParams.set("interval", state.intervalMinutes);
              history.replaceState({}, "", url);
              render();
            });
            element.addEventListener("keydown", (event) => {
              if (event.key === "Enter") element.blur();
            });
          });

          document.querySelectorAll("[data-threshold]").forEach((element) => {
            element.addEventListener("change", () => {
              state.threshold = Number(element.value);
              render();
            });
            element.addEventListener("input", () => {
              element.parentElement.querySelector("output").textContent = `${Number(element.value).toFixed(2)} bp`;
            });
          });

          document.querySelectorAll(".scanner-table tbody tr[data-pair]").forEach((element) => {
            element.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                element.click();
              }
            });
            element.tabIndex = 0;
          });
        }

        function setVariant(direction) {
          const current = variants.findIndex((variant) => variant.key === state.variant);
          const next = (current + direction + variants.length) % variants.length;
          state.variant = variants[next].key;
          const url = new URL(location.href);
          url.searchParams.set("variant", state.variant);
          history.replaceState({}, "", url);
          render();
        }

        document.getElementById("previous-variant").addEventListener("click", () => setVariant(-1));
        document.getElementById("next-variant").addEventListener("click", () => setVariant(1));
        window.addEventListener("keydown", (event) => {
          const target = event.target;
          const editing =
            target instanceof HTMLInputElement ||
            target instanceof HTMLTextAreaElement ||
            target?.isContentEditable;
          if (editing) return;
          if (event.key === "ArrowLeft") setVariant(-1);
          if (event.key === "ArrowRight") setVariant(1);
        });

        render();
      })();
    </script>
  </body>
</html>
